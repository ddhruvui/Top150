name: Top150 daily

# 04:30 America/New_York, every day.
# Cron is UTC-only, so both offsets are scheduled and the gate below keeps the one
# that is 04:30 local today: 08:30 UTC under EDT, 09:30 UTC under EST.
on:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

concurrency:
  group: top150-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Keep only the 04:30 Eastern trigger
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Offset from UTC in New York right now: -0400 under EDT, -0500 under EST.
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then want="30 8 * * *"; else want="30 9 * * *"; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Write runpod/.env and .env
        if: steps.gate.outputs.run == 'true'
        env:
          RUNPOD_ENV: ${{ secrets.RUNPOD_ENV }}
          TOP150_ENV: ${{ secrets.TOP150_ENV }}
        run: |
          [ -n "$RUNPOD_ENV" ] || { echo "secret RUNPOD_ENV (the contents of runpod/.env) is not set" >&2; exit 1; }
          [ -n "$TOP150_ENV" ] || { echo "secret TOP150_ENV (the contents of the repo-root .env: MONGO_URI etc.) is not set" >&2; exit 1; }
          umask 077
          # A secret pasted from a CRLF source would leave \r on every value.
          printf '%s\n' "$RUNPOD_ENV" | tr -d '\r' > runpod/.env
          printf '%s\n' "$TOP150_ENV" | tr -d '\r' > .env
          # Key names only, never values — enough to spot a mangled paste.
          echo "runpod/.env keys: $(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' runpod/.env | tr -d '=' | xargs)"
          echo ".env keys: $(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' .env | tr -d '=' | xargs)"

      # RunPod's S3 rejects downloads from the runner's newer aws-cli (2.36.x:
      # SignatureDoesNotMatch on GetObject) but takes them from 2.31.18, the version
      # that works from the laptop. Pin it until a newer one is proven.
      - name: Pin aws-cli 2.31.18
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.31.18.zip -o "$RUNNER_TEMP/awscli.zip"
          unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/aws/install" --update
          aws --version

      - name: Daily loop (verify_source -> market -> predict)
        if: steps.gate.outputs.run == 'true'
        run: scripts/daily_top150.sh
