# ============================================================================
# CORE-105 (branch core105): the adopted aggressive cash book run on a FIXED,
# hand-picked universe of 103 names — universe.tickers below — instead of the
# point-in-time top-N dollar-volume ranking. Identical to system.yaml except
# the universe block.
#
# The list IS the universe: no dollar-volume ranking, no hysteresis, no
# min_price screen, and no fund exclusion. SPY and QQQ were tradable members
# until 2026-09-27 and are no longer: the ranking only ever put them low enough
# to be SHORTED (SPY 299 shorts, 11% won). SPY stays the index
# (data.index_symbol) for the regime overlay and the baselines. A name joins
# from the first month-end it has prices, so a
# recent listing is not back-dated. Because config_hash is the SHA-256 of this
# file, editing the list forces a full refit — which is what a different
# universe should do.
#
# Every ticker is QUOTED: unquoted, YAML 1.1 reads ON (ON Semiconductor) as the
# boolean true, and would silently drop it from the universe.
#
# SURVIVORSHIP / LOOK-AHEAD: a list chosen in 2026 and backtested to 2000 is
# not survivorship-free (G-05 assumed the ranking). Backtest numbers here are
# optimistic by construction; treat cross-universe comparisons with care.
#
# Pods mount crimtr8kbf and write only under results/Core105 — see
# scripts/launch_core105.sh.
# ============================================================================
# ============================================================================
# EOD Swing & Position Trading System — single source of truth (§3)
# SHA-256 of this file = config_hash stamped on every artifact (G-10).
# Defaults are the spec's values; where the spec gives a range, the default
# sits inside it and search is confined to that range. `req` = must be set
# explicitly before live.
# ============================================================================

