# Render Blueprint for the research console (static site). Optional — the same
# four settings can be typed into the dashboard; see README.md.
services:
  - type: web
    name: top150-ui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://top150-be.vercel.app   # the deployed API origin (no trailing slash)
